name: Open-source code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-analyzers:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - run: dotnet format ArcForges.slnx whitespace --verify-no-changes --no-restore
      - run: dotnet format ArcForges.slnx style --verify-no-changes --severity warn --no-restore
      - run: dotnet format ArcForges.slnx analyzers --verify-no-changes --severity warn --no-restore

  native-clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lukka/get-cmake@1585ab63d6b868cbe53e9d1c2fa929b04b1ec2da # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-Linux-tidy-${{ env.VCPKG_COMMIT }}
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP vcpkg
          git clone --filter=blob:none https://github.com/microsoft/vcpkg $root
          git -C $root checkout --detach $env:VCPKG_COMMIT
          & "$root/bootstrap-vcpkg.sh" -disableMetrics
          $archives = Join-Path $env:RUNNER_TEMP vcpkg-archives
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> $env:GITHUB_ENV
      - run: sudo apt-get update && sudo apt-get install --yes autoconf autoconf-archive automake clang-tidy libtool libdrm-dev nasm yasm
      - run: cmake --preset linux-clang-x64-runtime-shared '-DCMAKE_CXX_CLANG_TIDY=clang-tidy'
      - run: cmake --build --preset linux-clang-x64-runtime-shared-release
      - run: cmake --preset linux-clang-x64-shim-static '-DCMAKE_CXX_CLANG_TIDY=clang-tidy'
      - run: cmake --build --preset linux-clang-x64-shim-static-release

  repository-linters:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_CLANG_FORMAT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true

  code-quality-gate:
    if: always()
    needs: [managed-analyzers, native-clang-tidy, repository-linters]
    runs-on: ubuntu-latest
    env:
      GATE_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every open-source quality job
        shell: pwsh
        run: |
          $jobs = $env:GATE_NEEDS | ConvertFrom-Json
          $failed = @($jobs.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count) {
            $failed | ForEach-Object { "{0}: {1}" -f $_.Name, $_.Value.result } | Write-Host
            throw 'One or more code-quality jobs did not succeed.'
          }
