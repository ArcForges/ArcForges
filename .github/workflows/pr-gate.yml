name: CI

# Job names are a contract. Every numbered step's completion gate is allowed to reference these by name
# (`locked-restore`, `architecture-tests`, `suppression-audit`, ...), so renaming one is a plan change, not
# a refactor. Step 01.06 fixes the ten managed gate names; the native, app, android and hook jobs below
# predate it and keep their own names.
#
# Each job is deliberately self-contained rather than sharing a build through artifacts. The cost is a
# repeated restore; the benefit is that a red job names exactly one gate and can be re-run alone.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  VCPKG_COMMIT: 36677bbd0b3bf11da7376e62e14bffcc54d2eaeb
  VCPKG_WINDOWS_X64_GRAPH_REVISION: runtime-gpu-and-static-shims-v1
  SCCACHE_VERSION: 0.17.0

jobs:
  locked-restore:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - name: Verify the locked restore left the checkout unchanged
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count) {
            $dirty | Write-Host
            throw 'Locked restore changed the checkout.'
          }

  format-analyzers:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - run: dotnet format ArcForges.slnx --verify-no-changes --no-restore

  build:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - run: dotnet build ArcForges.slnx -c Debug --no-restore
      - run: dotnet build ArcForges.slnx -c Release --no-restore

  unit-tests:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - run: dotnet build ArcForges.slnx -c Release --no-restore
      - name: Run the unit slice
        shell: pwsh
        run: |
          # Exit code 8 ("zero tests ran") is tolerated per assembly in Directory.Build.targets, because a
          # single category leaves most of them empty. That tolerance would hide a slice that ran nothing,
          # so the slice total is checked here.
          $log = Join-Path $env:RUNNER_TEMP 'unit-slice.log'
          dotnet test --solution ArcForges.slnx -c Release --no-build --no-restore -p:ArcForgesManagedTestTaxonomy=true --filter-trait Category=Unit 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'The unit slice failed.' }
          # The runner emits the summary with ANSI colour even through a pipe, so "ESC[m  total: 6" never
          # matches a plain start-of-line anchor. Escapes are stripped before the total is read.
          $clean = [regex]::Replace((Get-Content -Raw -LiteralPath $log), "$([char]27)\[[0-9;]*[A-Za-z]", '')
          $summary = [regex]::Matches($clean, '(?m)^\s*total:\s*(\d+)\s*$')
          if ($summary.Count -eq 0) { throw 'The unit slice printed no summary.' }
          if ([int]$summary[$summary.Count - 1].Groups[1].Value -le 0) { throw 'The unit slice reported no tests at all.' }

  integration-tests:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - run: dotnet build ArcForges.slnx -c Release --no-restore
      - name: Run the integration slice
        shell: pwsh
        run: |
          # Exit code 8 ("zero tests ran") is tolerated per assembly in Directory.Build.targets, because a
          # single category leaves most of them empty. That tolerance would hide a slice that ran nothing,
          # so the slice total is checked here.
          $log = Join-Path $env:RUNNER_TEMP 'integration-slice.log'
          dotnet test --solution ArcForges.slnx -c Release --no-build --no-restore -p:ArcForgesManagedTestTaxonomy=true --filter-trait Category=Integration Category=Contract Category=Ui 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'The integration slice failed.' }
          # The runner emits the summary with ANSI colour even through a pipe, so "ESC[m  total: 6" never
          # matches a plain start-of-line anchor. Escapes are stripped before the total is read.
          $clean = [regex]::Replace((Get-Content -Raw -LiteralPath $log), "$([char]27)\[[0-9;]*[A-Za-z]", '')
          $summary = [regex]::Matches($clean, '(?m)^\s*total:\s*(\d+)\s*$')
          if ($summary.Count -eq 0) { throw 'The integration slice printed no summary.' }
          if ([int]$summary[$summary.Count - 1].Groups[1].Value -le 0) { throw 'The integration slice reported no tests at all.' }

  architecture-tests:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj --locked-mode
      # The rules load every referenced src assembly, so this build is the analysed surface itself.
      - run: dotnet build tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-restore
      - run: dotnet test --project tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-build --no-restore --filter-trait Category=Architecture

  suppression-audit:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj --locked-mode
      - run: dotnet build tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-restore
      - name: Audit trimming suppressions and their count baseline
        run: dotnet test --project tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-build --no-restore --filter-method '*TrimmingSuppression*'

  no-inline-versions:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      # VerifyNoInlinePackageVersions runs before CollectPackageReferences, so restore is the gate.
      - run: dotnet restore ArcForges.slnx --locked-mode
      - run: dotnet build tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-restore
      - name: Enforce SPDX headers and the preview-package allowlist
        run: dotnet test --project tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-build --no-restore --filter-method '*FirstPartySourceFilesDeclareSpdx*' '*LockedPackagesContainNoUnapprovedPreviewVersions*'

  dependency-audit:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - name: Fail on any vulnerable package
        shell: pwsh
        run: |
          $report = dotnet list ArcForges.slnx package --vulnerable --include-transitive
          $report | Write-Host
          if ($report -match 'has the following vulnerable packages') {
            throw 'Vulnerable packages were reported.'
          }
      - run: dotnet build tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-restore
      - name: Every central package must appear in the third-party license register
        run: dotnet test --project tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-build --no-restore --filter-method '*EveryCentralPackageIsRegistered*'
      - name: Emit the resolved dependency graph as an SBOM artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/sbom | Out-Null
          dotnet list ArcForges.slnx package --include-transitive --format json | Out-File -Encoding utf8 artifacts/sbom/dependency-graph.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-graph
          path: artifacts/sbom/dependency-graph.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          show-openssf-scorecard: true
      - name: Scan the repository for secrets
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f" \
            detect --source=/repo --no-banner --redact --config=/repo/.gitleaks.toml

  native-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Pin vcpkg checkout
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Runner vcpkg installation was not found.' }
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg fetch failed.' }
          git -C $root checkout --detach --force $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed.' }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed.' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:VCPKG_COMMIT) { throw "Unexpected vcpkg commit: $actual" }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Resolve vcpkg toolchain fingerprint
        id: vcpkg-toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere was not found.' }
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $installationVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          if (-not $installationPath -or -not $installationVersion) { throw 'Visual Studio C++ tools were not found.' }
          $vcToolsVersion = (Get-Content -LiteralPath (Join-Path $installationPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $compiler = Join-Path $installationPath "VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64\cl.exe"
          $compilerVersion = (Get-Item -LiteralPath $compiler).VersionInfo.FileVersion
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = (Get-ChildItem -LiteralPath $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -replace '^cmake version\s+', '').Trim()
          $ninjaVersion = (ninja --version).Trim()
          $identity = [ordered]@{
            visualStudio = $installationVersion
            vcTools = $vcToolsVersion
            compiler = $compilerVersion
            windowsSdk = $sdkVersion
            cmake = $cmakeVersion
            ninja = $ninjaVersion
          } | ConvertTo-Json -Compress
          $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT
          "vcpkg toolchain: $identity"
          "vcpkg toolchain fingerprint: $fingerprint"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-${{ hashFiles('eng/native/vcpkg/ports/**') }}
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-
      - name: Install native dependencies
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          $archives = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force $archives | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$archives,readwrite"
          & "$root/vcpkg.exe" install `
            'ffmpeg[core,avcodec,avfilter,avformat,swresample,swscale,vulkan,qsv,nvcodec,amf]:x64-windows' `
            'libusb[core]:x64-windows' `
            'miniaudio[core]:x64-windows' `
            'opentimelineio[core]:x64-windows-static-md' `
            'opencolorio[core]:x64-windows-static-md' `
            'openimageio[core]:x64-windows-static-md' `
            'openexr[core]:x64-windows-static-md' `
            'imath[core]:x64-windows-static-md' `
            'mdflib[core]:x64-windows-static-md' `
            "--overlay-ports=${{ github.workspace }}/eng/native/vcpkg/ports"
          if ($LASTEXITCODE) { throw 'vcpkg install failed.' }
      - name: Install the pinned sccache
        shell: pwsh
        run: |
          # Scoop pins the version explicitly so a compiler cache upgrade is a reviewed change, not a
          # silent one that invalidates every cached object.
          iwr -useb get.scoop.sh | iex
          scoop install sccache@${{ env.SCCACHE_VERSION }}
          if ($LASTEXITCODE) { throw 'sccache install failed.' }
          "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH
          "SCCACHE_DIR=$env:RUNNER_TEMP\sccache" >> $env:GITHUB_ENV
      - name: Restore the sccache objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_VERSION }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ hashFiles('native/**', 'CMakePresets.json') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_VERSION }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-
      - run: dotnet workload install maui-android wasm-tools --skip-manifest-update
      - run: dotnet restore ArcForges.slnx --locked-mode
      - name: Build, test, and stage both CMake profiles
        shell: cmd
        run: |
          @echo on
          rem vcvars64 is required because the presets use Ninja, which needs cl.exe on PATH. It also
          rem overwrites VCPKG_ROOT with the Visual Studio bundled vcpkg, so the pinned checkout is
          rem captured first and restored after: implementation-repository-layout.md §9.1 pins one vcpkg
          rem baseline and lock as the only dependency root, and the bundled copy resolves a different graph.
          set "ARCFORGES_VCPKG_ROOT=%VCPKG_ROOT%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ARCFORGES_VS=%%i"
          if not defined ARCFORGES_VS exit /b 1
          call "%ARCFORGES_VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "VCPKG_ROOT=%ARCFORGES_VCPKG_ROOT%"
          if /i not "%VCPKG_ROOT%"=="%ARCFORGES_VCPKG_ROOT%" exit /b 1
          echo VCPKG_ROOT=%VCPKG_ROOT%

          sccache --start-server || exit /b 1
          sccache --zero-stats || exit /b 1

          for %%p in (runtime-shared shim-static) do (
            cmake --preset win-x64-%%p || exit /b 1
            cmake --build --preset win-x64-%%p || exit /b 1
            ctest --preset win-x64-%%p || exit /b 1
            cmake --install artifacts/cmake/win-x64/%%p || exit /b 1
          )

          sccache --show-stats || exit /b 1
      - name: Prove sccache actually cached
        shell: pwsh
        run: |
          # A launcher that is configured but never consulted is worthless, and a build that produces only
          # non-cacheable calls looks green while caching nothing. Both are checked, not assumed.
          $stats = sccache --show-stats | Out-String
          $stats | Write-Host
          $requests = [int]([regex]::Match($stats, 'Compile requests\s+(\d+)').Groups[1].Value)
          $nonCacheable = [int]([regex]::Match($stats, 'Non-cacheable compilations\s+(\d+)').Groups[1].Value)
          if ($requests -le 0) { throw 'sccache saw no compile requests; the launcher is not wired up.' }
          if ($nonCacheable -gt 0) {
            throw "sccache reported $nonCacheable non-cacheable compilations; debug information must stay Embedded."
          }
      - name: Run managed P/Invoke over app-local CMake artifacts
        shell: pwsh
        run: |
          dotnet build tests/NativeAbiTests/ArcForges.Tests.NativeAbiTests.csproj -c Release --no-restore
          if ($LASTEXITCODE) { throw 'Managed native ABI test build failed.' }
          $runtime = Join-Path '${{ github.workspace }}' 'artifacts/stage/native/win-x64/native'
          $testOutput = Join-Path '${{ github.workspace }}' 'artifacts/bin/dotnet/windows/ArcForges.Tests.NativeAbiTests/Release/net10.0'
          $nativeDlls = @(Get-ChildItem -LiteralPath $runtime -File -Filter '*.dll')
          if (-not $nativeDlls.Count) { throw 'CMake staged no native runtime DLLs.' }
          try {
            Copy-Item -LiteralPath $nativeDlls.FullName -Destination $testOutput
            & (Join-Path $testOutput 'ArcForges.Tests.NativeAbiTests.exe')
            if ($LASTEXITCODE) { throw 'Managed P/Invoke over CMake artifacts failed.' }
          } finally {
            $nativeDlls | ForEach-Object { Remove-Item -LiteralPath (Join-Path $testOutput $_.Name) -Force -ErrorAction SilentlyContinue }
          }

  app-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev libbrotli-dev xvfb
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish and initialize one real Avalonia window
        run: |
          dotnet restore src/ArcChat/ArcChat.Desktop/ArcChat.Desktop.csproj --locked-mode
          dotnet publish src/ArcChat/ArcChat.Desktop/ArcChat.Desktop.csproj -c Release -r linux-x64 --self-contained true --no-restore -o artifacts/desktop
          xvfb-run --auto-servernum artifacts/desktop/ArcChat.Desktop --smoke | grep -F 'ok arcforges-smoke avalonia-window'
      - name: Publish and probe Cloud HTTP plus SignalR
        shell: pwsh
        run: |
          $project = 'src/Cloud/ArcForges.Cloud.Host/ArcForges.Cloud.Host.csproj'
          dotnet restore $project --locked-mode
          dotnet publish $project -c Release --self-contained false --no-restore -o artifacts/cloud
          $process = Start-Process dotnet -ArgumentList @('artifacts/cloud/ArcForges.Cloud.Host.dll', '--urls', 'http://127.0.0.1:5087') -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:5087/health
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Cloud /health never became ready.' }
            $root = Invoke-RestMethod http://127.0.0.1:5087/
            if (-not $root.ok -or $root.app -ne 'arcforges-cloud') { throw 'Cloud root contract failed.' }
            $negotiate = Invoke-RestMethod -Method Post 'http://127.0.0.1:5087/hubs/v1/events/negotiate?negotiateVersion=1'
            if ([string]::IsNullOrWhiteSpace($negotiate.connectionToken)) { throw 'SignalR negotiate returned no token.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Publish Web and build Browser tests
        run: |
          dotnet restore src/Web/ArcForges.Web.App/ArcForges.Web.App.csproj --locked-mode
          dotnet restore tests/Web/ArcForges.Web.BrowserTests/ArcForges.Web.BrowserTests.csproj --locked-mode
          dotnet publish src/Web/ArcForges.Web.App/ArcForges.Web.App.csproj -c Release --no-restore -o artifacts/web
          dotnet build tests/Web/ArcForges.Web.BrowserTests/ArcForges.Web.BrowserTests.csproj -c Release --no-restore
      - name: Verify the browser Selenium Manager will drive
        run: |
          google-chrome --version
      - name: Serve and probe Web in Chromium
        shell: pwsh
        run: |
          $server = Start-Process python3 -ArgumentList @('-m', 'http.server', '8080', '--directory', 'artifacts/web/wwwroot') -PassThru
          try {
            $env:ARCFORGES_WEB_BASE_URL = 'http://127.0.0.1:8080'
            dotnet test --project tests/Web/ArcForges.Web.BrowserTests/ArcForges.Web.BrowserTests.csproj -c Release --no-build --filter-trait Category=Browser
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  android-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android --skip-manifest-update
      - run: dotnet restore src/Mobile/ArcChat.Mobile/ArcChat.Mobile.csproj --locked-mode
      - name: Publish one production Android APK
        run: dotnet publish src/Mobile/ArcChat.Mobile/ArcChat.Mobile.csproj -f net10.0-android -c Release -r android-arm64 --no-restore -p:AndroidPackageFormats=apk
      - name: Stage the signed APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/android | Out-Null
          $apk = Get-ChildItem artifacts/bin/dotnet/windows/ArcChat.Mobile/Release/net10.0-android/android-arm64 -File -Filter '*-Signed.apk' | Select-Object -First 1
          if (-not $apk) { throw 'The signed Android APK was not produced.' }
          Copy-Item -LiteralPath $apk.FullName artifacts/android/ArcChat.Mobile-arm64-Signed.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcchat-android-arm64
          path: artifacts/android/ArcChat.Mobile-arm64-Signed.apk

  repository-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pre-commit
        run: python3 -m pip install --disable-pip-version-check pre-commit
      - name: Run repository hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  ci:
    if: always()
    needs:
      - locked-restore
      - format-analyzers
      - build
      - unit-tests
      - integration-tests
      - architecture-tests
      - suppression-audit
      - no-inline-versions
      - dependency-audit
      - secret-scan
      - native-win-x64
      - app-smoke
      - android-package
      - repository-hooks
    runs-on: ubuntu-latest
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every CI job
        shell: pwsh
        run: |
          $jobs = $env:CI_NEEDS | ConvertFrom-Json
          $failed = @($jobs.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count) {
            $failed | ForEach-Object { "{0}: {1}" -f $_.Name, $_.Value.result } | Write-Host
            throw 'One or more CI jobs did not succeed.'
          }
