name: AOT publish smoke

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'eng/build/**'
      - 'Directory.*'

permissions:
  contents: read

jobs:
  desktop-native-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev libbrotli-dev
      - name: Publish all desktop heads
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          foreach ($product in 'ArcChat', 'ArcNotes', 'ArcScope', 'ArcSlate') {
            $project = "src/$product/$product.Desktop/$product.Desktop.csproj"
            $output = "artifacts/smoke/$rid/$product"
            dotnet restore $project --locked-mode
            if ($LASTEXITCODE) { throw "[$rid,$product,restore] failed." }
            dotnet publish $project -c Release -r $rid --self-contained true --no-restore -o $output
            if ($LASTEXITCODE) { throw "[$rid,$product,publish] failed." }
            $extension = if ($rid.StartsWith('win-', [StringComparison]::Ordinal)) { '.exe' } else { '' }
            $result = & (Join-Path $output "$product.Desktop$extension") --smoke
            if ($LASTEXITCODE -or $result -notmatch 'ok arcforges-smoke') {
              throw "[$rid,$product,run] failed: $result"
            }
          }

  cloud-jit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore src/Cloud/ArcForges.Cloud.Host/ArcForges.Cloud.Host.csproj --locked-mode
      - run: dotnet publish src/Cloud/ArcForges.Cloud.Host/ArcForges.Cloud.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained false --no-restore

  win-arm64-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          $rid = 'win-arm64'
          foreach ($product in 'ArcChat', 'ArcNotes', 'ArcScope', 'ArcSlate') {
            $project = "src/$product/$product.Desktop/$product.Desktop.csproj"
            $output = "artifacts/smoke/$rid/$product"
            dotnet restore $project --locked-mode
            if ($LASTEXITCODE) { throw "[$rid,$product,restore] failed." }
            dotnet publish $project -c Release -r $rid --self-contained true --no-restore -o $output
            if ($LASTEXITCODE) { throw "[$rid,$product,publish] failed." }
          }
