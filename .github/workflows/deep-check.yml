name: Deep check

on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: deep-check
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VCPKG_COMMIT: 36677bbd0b3bf11da7376e62e14bffcc54d2eaeb
  VCPKG_WINDOWS_X64_GRAPH_REVISION: runtime-gpu-and-static-shims-v1
  VCPKG_LINUX_X64_GRAPH_REVISION: runtime-gpu-and-static-shims-v1

jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, cpp]
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - name: Build C#
        if: matrix.language == 'csharp'
        run: |
          dotnet workload install maui-android wasm-tools --skip-manifest-update
          dotnet restore ArcForges.slnx --locked-mode
          dotnet build ArcForges.slnx -c Release --no-restore
      - uses: lukka/get-cmake@1585ab63d6b868cbe53e9d1c2fa929b04b1ec2da # v4.4.2
        if: matrix.language == 'cpp'
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Pin vcpkg checkout
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Runner vcpkg installation was not found.' }
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg fetch failed.' }
          git -C $root checkout --detach $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed.' }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed.' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:VCPKG_COMMIT) { throw "Unexpected vcpkg commit: $actual" }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.language == 'cpp'
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-classic-Windows-x64-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-${{ hashFiles('eng/native/vcpkg/ports/**') }}
          restore-keys: |
            vcpkg-classic-Windows-x64-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-
            vcpkg-classic-Windows-x64-
      - name: Install Windows native dependencies
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          $archives = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force $archives | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$archives,readwrite"
          & "$root/vcpkg.exe" install `
            'ffmpeg[core,avcodec,avfilter,avformat,swresample,swscale,vulkan,qsv,nvcodec,amf]:x64-windows' `
            'libusb[core]:x64-windows' `
            'miniaudio[core]:x64-windows' `
            'opentimelineio[core]:x64-windows-static-md' `
            'opencolorio[core]:x64-windows-static-md' `
            'openimageio[core]:x64-windows-static-md' `
            'openexr[core]:x64-windows-static-md' `
            'imath[core]:x64-windows-static-md' `
            'mdflib[core]:x64-windows-static-md' `
            "--overlay-ports=${{ github.workspace }}/eng/native/vcpkg/ports"
          if ($LASTEXITCODE) { throw 'vcpkg install failed.' }
      - name: Build C++
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          foreach ($profile in 'runtime-shared', 'shim-static') {
            $preset = "windows-msvc-x64-$profile"
            cmake --preset $preset
            if ($LASTEXITCODE) { throw "$preset configure failed." }
            cmake --build --preset "$preset-release"
            if ($LASTEXITCODE) { throw "$preset build failed." }
          }
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4

  native-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lukka/get-cmake@1585ab63d6b868cbe53e9d1c2fa929b04b1ec2da # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Pin vcpkg checkout
        run: |
          root="${VCPKG_INSTALLATION_ROOT:?Runner vcpkg installation was not found.}"
          git -C "$root" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$root" checkout --detach "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          test "$(git -C "$root" rev-parse HEAD)" = "$VCPKG_COMMIT"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-classic-Linux-x64-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_LINUX_X64_GRAPH_REVISION }}-${{ hashFiles('eng/native/vcpkg/ports/**') }}
          restore-keys: |
            vcpkg-classic-Linux-x64-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_LINUX_X64_GRAPH_REVISION }}-
            vcpkg-classic-Linux-x64-
      - run: sudo apt-get update && sudo apt-get install --yes autoconf autoconf-archive automake clang-tidy libtool libdrm-dev nasm yasm
      - name: Install Linux native dependencies
        run: |
          root="$VCPKG_ROOT"
          archives="$RUNNER_TEMP/vcpkg-archives"
          mkdir -p "$archives"
          export VCPKG_BINARY_SOURCES="clear;files,$archives,readwrite"
          "$root/vcpkg" install \
            'ffmpeg[core,avcodec,avfilter,avformat,swresample,swscale,vulkan,qsv,nvcodec,vaapi]:x64-linux-dynamic' \
            'libusb[core]:x64-linux-dynamic' \
            'miniaudio[core]:x64-linux-dynamic' \
            'opentimelineio[core]:x64-linux' \
            'opencolorio[core]:x64-linux' \
            'openimageio[core]:x64-linux' \
            'openexr[core]:x64-linux' \
            'imath[core]:x64-linux' \
            'mdflib[core]:x64-linux' \
            "--overlay-ports=$GITHUB_WORKSPACE/eng/native/vcpkg/ports"
      - name: Run clang-tidy, ASan, UBSan, tests, and fuzzers
        run: |
          cmake --preset linux-clang-x64-runtime-shared-asan '-DCMAKE_CXX_CLANG_TIDY=clang-tidy'
          cmake --build --preset linux-clang-x64-runtime-shared-asan
          ctest --preset linux-clang-x64-runtime-shared-asan
          cmake --preset linux-clang-x64-shim-static-asan '-DCMAKE_CXX_CLANG_TIDY=clang-tidy'
          cmake --build --preset linux-clang-x64-shim-static-asan
          ctest --preset linux-clang-x64-shim-static-asan
          artifacts/cmake/linux-clang-x64/runtime-shared-asan/native/arcmedia-ffmpeg-abi/arcmedia_ffmpeg_abi_fuzzer -runs=2000
          for fuzzer in artifacts/cmake/linux-clang-x64/shim-static-asan/native/*-abi/*_fuzzer; do
            "$fuzzer" -runs=2000
          done
