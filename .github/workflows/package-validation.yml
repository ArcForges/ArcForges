# SPDX-License-Identifier: AGPL-3.0-only
name: Package validation
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      native_artifact_name:
        type: string
        required: true
      naming_evidence_artifact:
        type: string
        required: true
      secret_evidence_artifact:
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.pack.outputs.version }}
      artifact_name:
        value: ${{ jobs.pack.outputs.artifact_name }}
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
jobs:
  local-rpc-aot:
    name: Local RPC AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/LocalRpcAotTests/LocalRpcAotTests.csproj --locked-mode
      - name: Publish the process probe with Native AOT (compile only)
        run: dotnet publish tests/LocalRpcAotTests/LocalRpcAotTests.csproj -c Release -r ${{ matrix.rid }} --no-restore
  aot-probe:
    name: Avalonia TableView Native AOT probe (compile only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore the exact probe lock graph
        run: dotnet restore eng/verification/probe-evidence/Prf09.TableViewProbe.csproj --locked-mode
      - name: Publish the candidate control with Native AOT (compile only)
        run: dotnet publish eng/verification/probe-evidence/Prf09.TableViewProbe.csproj -c Release -r win-x64 --no-restore
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Allocate version before compilation
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          python eng/packaging/packages.py version --version $version
          if ($LASTEXITCODE) { throw 'Invalid package version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=nuget-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.native_artifact_name }}
          path: artifacts/native-packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.naming_evidence_artifact }}
          path: artifacts/evidence/imported/naming
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.secret_evidence_artifact }}
          path: artifacts/evidence/imported/secret
      - name: Require successful external gates from this exact source and CI attempt
        run: python eng/architecture_evidence.py combine --naming artifacts/evidence/imported/naming/naming-architecture.json --secret artifacts/evidence/imported/secret/secret-architecture.json --output artifacts/evidence/architecture-gates.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/architecture-gates.json
          if-no-files-found: error
          retention-days: 30
      - run: dotnet restore DesktopPlatform.slnx --locked-mode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-licence-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/native-architecture
      - run: dotnet format DesktopPlatform.slnx --verify-no-changes --no-restore
      - name: Build and test platform ownership
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: |
          dotnet build DesktopPlatform.slnx -c Release --no-restore -p:EmitCompilerGeneratedFiles=true "-p:PackageVersion=$env:PACKAGE_VERSION" "-p:Version=$env:PACKAGE_VERSION"
          if ($LASTEXITCODE) { throw 'Platform build failed.' }
          dotnet test --project tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Platform ownership tests failed.' }
          dotnet test --project src/BuildingBlocks/ArcForges.Foundation/Tests/ArcForges.Foundation.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Foundation primitive tests failed.' }
          dotnet test --project src/BuildingBlocks/ArcForges.Persistence.Resources/Tests/ArcForges.Persistence.Resources.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Append store offline tests failed.' }
          dotnet test --project src/BuildingBlocks/ArcForges.Capabilities/Tests/ArcForges.Capabilities.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Application composition tests failed.' }
          dotnet test --project src/DesignSystem/ArcForges.DesignSystem/Tests/ArcForges.DesignSystem.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Design system token and contrast tests failed.' }
          dotnet test --project src/BuildingBlocks/ArcForges.Contributions/Tests/ArcForges.Contributions.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Contribution registration tests failed.' }
          dotnet test --project src/BuildingBlocks/ArcForges.Security/Tests/ArcForges.Security.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Security actor chain tests failed.' }
          dotnet test --project tests/PersistenceTests/ArcForges.Tests.PersistenceTests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Persistence transaction, journal and migration tests failed.' }
          python src/BuildingBlocks/ArcForges.Foundation/Errors/generate_registry.py --check
          if ($LASTEXITCODE) { throw 'Foundation reason registry drifted.' }
      - name: Pack explicit release allowlist and verify immutable manifest
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: python eng/packaging/packages.py pack --version "$PACKAGE_VERSION"
      - name: Verify rejection of invalid versions and altered candidates
        run: python -m unittest discover -s eng/packaging -p 'test_*.py' -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30
