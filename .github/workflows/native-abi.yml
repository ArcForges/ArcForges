# SPDX-License-Identifier: AGPL-3.0-only
name: Native build
on:
  workflow_call:
    outputs:
      artifact_name:
        value: ${{ jobs.native-win-x64.outputs.artifact_name }}
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  VCPKG_COMMIT: 36677bbd0b3bf11da7376e62e14bffcc54d2eaeb
  VCPKG_WINDOWS_X64_GRAPH_REVISION: platform-image-only-v3
  SCCACHE_VERSION: 0.17.0
jobs:
  image-portable-inputs:
    # Compile real available Windows/Linux producers. These unactivated inputs
    # are never package admission or OS execution evidence; macOS CI is excluded.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            triplet: x64-windows-static-md
            msvc_target: x64
            crt_arch: x64
          - rid: win-arm64
            runner: windows-latest
            triplet: arm64-windows-static-md
            msvc_target: x64_arm64
            crt_arch: arm64
          - rid: linux-x64
            runner: ubuntu-24.04
            triplet: x64-linux
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_RID: ${{ matrix.rid }}
      IMAGE_TRIPLET: ${{ matrix.triplet }}
      IMAGE_MSVC_TARGET: ${{ matrix.msvc_target }}
      IMAGE_CRT_ARCH: ${{ matrix.crt_arch }}
      VCPKG_MAX_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.4.0'
          ninjaVersion: '1.13.1'
      - name: Pin the Image producer dependency source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg-image-$env:IMAGE_RID"
          git clone --no-checkout https://github.com/microsoft/vcpkg.git $root
          if ($LASTEXITCODE) { throw 'Pinned Image vcpkg source acquisition failed.' }
          git -C $root checkout --detach $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'Pinned Image vcpkg checkout failed.' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:VCPKG_COMMIT) { throw 'Unexpected Image dependency source.' }
          if ($IsWindows) { & "$root/bootstrap-vcpkg.bat" -disableMetrics }
          else { & "$root/bootstrap-vcpkg.sh" -disableMetrics }
          if ($LASTEXITCODE) { throw 'Image producer vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$root/downloads" >> $env:GITHUB_ENV
          $archives = Join-Path $env:RUNNER_TEMP "image-vcpkg-archives-$env:IMAGE_RID"
          New-Item -ItemType Directory -Force $archives | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> $env:GITHUB_ENV
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/image-vcpkg-archives-${{ matrix.rid }}
          key: image-classic-${{ matrix.rid }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('eng/native/vcpkg/ports/**', 'eng/native/vcpkg/triplets/**', 'eng/provenance/artifact-profiles/image-runtime-producer-v1.json') }}
      - name: Install the actual Image dependency closure
        shell: pwsh
        run: |
          $installedRelative = if ($env:IMAGE_RID -eq 'win-x64') { 'artifacts/vcpkg-installed' } else { "artifacts/vcpkg-installed/$env:IMAGE_RID" }
          $installed = Join-Path $env:GITHUB_WORKSPACE $installedRelative
          $arguments = @('install', "opencolorio[core]:$env:IMAGE_TRIPLET", "openimageio[core]:$env:IMAGE_TRIPLET", "openexr[core]:$env:IMAGE_TRIPLET", "imath[core]:$env:IMAGE_TRIPLET", "--x-install-root=$installed", "--overlay-triplets=$env:GITHUB_WORKSPACE/eng/native/vcpkg/triplets")
          $vcpkg = if ($IsWindows) { "$env:VCPKG_ROOT/vcpkg.exe" } else { "$env:VCPKG_ROOT/vcpkg" }
          & $vcpkg @arguments
          if ($LASTEXITCODE) { throw 'Actual Image dependency compile failed.' }
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Compile and install the owned Windows Image ABI on its declared architecture
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          set "ARCFORGES_IMAGE_VCPKG_ROOT=%VCPKG_ROOT%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ARCFORGES_IMAGE_VS=%%i"
          if not defined ARCFORGES_IMAGE_VS exit /b 1
          call "%ARCFORGES_IMAGE_VS%\VC\Auxiliary\Build\vcvarsall.bat" %IMAGE_MSVC_TARGET% -vcvars_ver=14.51.36231 || exit /b 1
          set "VCPKG_ROOT=%ARCFORGES_IMAGE_VCPKG_ROOT%"
          set "VSLANG=1033"
          set "ARCFORGES_IMAGE_COMPILER=%ARCFORGES_IMAGE_VS%\VC\Tools\MSVC\14.51.36231\bin\Hostx64\%IMAGE_CRT_ARCH%\cl.exe"
          if not exist "%ARCFORGES_IMAGE_COMPILER%" exit /b 1
          cmake --fresh --preset image-%IMAGE_RID%-v1 "-DCMAKE_C_COMPILER=%ARCFORGES_IMAGE_COMPILER%" "-DCMAKE_CXX_COMPILER=%ARCFORGES_IMAGE_COMPILER%" -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER= || exit /b 1
          cmake --build --preset image-%IMAGE_RID%-v1 || exit /b 1
          cmake --install artifacts/cmake/image/%IMAGE_RID% --component ImageRuntime || exit /b 1
      - name: Compile and install the owned Linux Image ABI on its actual architecture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Preserve clang++ driver selection; staging hashes its stable physical target.
          image_cc="$(command -v clang)"
          image_cxx="$(command -v clang++)"
          test -f "$image_cc" && test -f "$image_cxx"
          cmake --fresh --preset "image-$IMAGE_RID-v1" "-DCMAKE_C_COMPILER=$image_cc" "-DCMAKE_CXX_COMPILER=$image_cxx" -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER=
          cmake --build --preset "image-$IMAGE_RID-v1"
          cmake --install "artifacts/cmake/image/$IMAGE_RID" --component ImageRuntime
      - name: Seal actual Image inputs without activating an unreviewed package
        shell: pwsh
        run: |
          python eng/packaging/image_runtime.py acquire-legal --rid $env:IMAGE_RID --downloads $env:VCPKG_DOWNLOADS
          if ($LASTEXITCODE) { throw 'Image legal-input acquisition failed.' }
          $arguments = @('eng/packaging/image_runtime.py', 'stage', '--rid', $env:IMAGE_RID, '--directory', "artifacts/image-production-input/$env:IMAGE_RID", '--vcpkg-root', $env:VCPKG_ROOT, '--downloads', $env:VCPKG_DOWNLOADS)
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $installation = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
            $runtime = Join-Path $installation "VC/Redist/MSVC/14.51.36231/$env:IMAGE_CRT_ARCH/Microsoft.VC145.CRT"
            $arguments += @('--compiler-runtime', $runtime)
          }
          python @arguments
          if ($LASTEXITCODE) { throw 'Image actual ABI/tool/dependency/source/legal/copy closure failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-production-input-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-production-input/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 30
  native-win-x64:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.native-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Verify effective native IDE declarations
        run: python eng/licence_boundary.py --evaluate-ide --report artifacts/evidence/licence-ide.json
      - name: Pin vcpkg checkout
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Runner vcpkg installation was not found.' }
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg fetch failed.' }
          git -C $root checkout --detach --force $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed.' }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed.' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:VCPKG_COMMIT) { throw "Unexpected vcpkg commit: $actual" }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Resolve vcpkg toolchain fingerprint
        id: vcpkg-toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere was not found.' }
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $installationVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          if (-not $installationPath -or -not $installationVersion) { throw 'Visual Studio C++ tools were not found.' }
          $profile = Get-Content -Raw eng/provenance/artifact-profiles/native-win-x64-r4.json | ConvertFrom-Json
          $vcToolsVersion = $profile.buildTools.msvcToolset
          $compiler = Join-Path $installationPath "VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64\cl.exe"
          $compilerVersion = (Get-Item -LiteralPath $compiler).VersionInfo.FileVersion
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = (Get-ChildItem -LiteralPath $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -replace '^cmake version\s+', '').Trim()
          $ninjaVersion = (ninja --version).Trim()
          $identity = [ordered]@{
            visualStudio = $installationVersion
            vcTools = $vcToolsVersion
            compiler = $compilerVersion
            windowsSdk = $sdkVersion
            cmake = $cmakeVersion
            ninja = $ninjaVersion
          } | ConvertTo-Json -Compress
          $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT
          "vcpkg toolchain: $identity"
          "vcpkg toolchain fingerprint: $fingerprint"
          "ARCFORGES_VCTOOLS_VERSION=$vcToolsVersion" >> $env:GITHUB_ENV
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-${{ hashFiles('eng/native/vcpkg/ports/**', 'eng/native/vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-
            vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-runtime-gpu-and-static-shims-v1-
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.4.0'
          ninjaVersion: '1.13.1'
      - name: Install native dependencies
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          $archives = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force $archives | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$archives,readwrite"
          & "$root/vcpkg.exe" install `
            'opencolorio[core]:x64-windows-static-md' `
            'openimageio[core]:x64-windows-static-md' `
            'openexr[core]:x64-windows-static-md' `
            'imath[core]:x64-windows-static-md' `
            "--x-install-root=${{ github.workspace }}/artifacts/vcpkg-installed" `
            "--overlay-triplets=${{ github.workspace }}/eng/native/vcpkg/triplets"
          if ($LASTEXITCODE) { throw 'vcpkg install failed.' }
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Install the pinned sccache
        shell: pwsh
        run: |
          # Scoop pins the version explicitly so a compiler cache upgrade is a reviewed change, not a
          # silent one that invalidates every cached object.
          iwr -useb get.scoop.sh | iex
          scoop install sccache@${{ env.SCCACHE_VERSION }}
          if ($LASTEXITCODE) { throw 'sccache install failed.' }
          "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH
          "SCCACHE_DIR=$env:RUNNER_TEMP\sccache" >> $env:GITHUB_ENV
      - name: Restore the sccache objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_VERSION }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ hashFiles('native/**', 'CMakePresets.json') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_VERSION }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-
      - run: dotnet restore DesktopPlatform.slnx --locked-mode
      - name: Acquire the exact admitted PDFium producer build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eng/native_provenance.py --acquire-pdfium artifacts/pdfium-admission
      - name: Build and stage the retained image CMake profile
        shell: cmd
        run: |
          @echo on
          rem vcvars64 is required because the presets use Ninja, which needs cl.exe on PATH. It also
          rem overwrites VCPKG_ROOT with the Visual Studio bundled vcpkg, so the pinned checkout is
          rem captured first and restored after: deploy/README.md pins one vcpkg
          rem baseline and lock as the only dependency root, and the bundled copy resolves a different graph.
          set "ARCFORGES_VCPKG_ROOT=%VCPKG_ROOT%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ARCFORGES_VS=%%i"
          if not defined ARCFORGES_VS exit /b 1
          call "%ARCFORGES_VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=%ARCFORGES_VCTOOLS_VERSION% || exit /b 1
          set "VCPKG_ROOT=%ARCFORGES_VCPKG_ROOT%"
          if /i not "%VCPKG_ROOT%"=="%ARCFORGES_VCPKG_ROOT%" exit /b 1
          echo VCPKG_ROOT=%VCPKG_ROOT%

          sccache --start-server || exit /b 1
          sccache --zero-stats || exit /b 1

          for %%p in (shim-static) do (
            cmake --preset win-x64-%%p || exit /b 1
            cmake --build --preset win-x64-%%p || exit /b 1
            cmake --install artifacts/cmake/win-x64/%%p || exit /b 1
          )

          ctest --test-dir artifacts/cmake/win-x64/shim-static --output-on-failure -R "^(arc_native_abi_c17_layout_tests|arc_native_abi_cpp20_tests|arcpdf_abi_engine_tests|arcpdf_abi_pdfium_tests|arcpdf_abi_unsupported_tests)$" || exit /b 1
          dotnet test --project tests/NativeAbiTests/ArcForges.Tests.NativeAbiTests.csproj --filter Category=NativeAbiLayout --no-restore || exit /b 1

          sccache --show-stats || exit /b 1
      - name: Seal the production PDF composition input for NAT.25
        run: python eng/native_provenance.py --stage-pdfium-input artifacts/pdfium-production-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pdfium-production-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pdfium-production-input/
          if-no-files-found: error
          retention-days: 30
      - name: Prove sccache actually cached
        shell: pwsh
        run: |
          # A launcher that is configured but never consulted is worthless, and a build that produces only
          # non-cacheable calls looks green while caching nothing. Both are checked, not assumed.
          $stats = sccache --show-stats | Out-String
          $stats | Write-Host
          $requests = [int]([regex]::Match($stats, 'Compile requests\s+(\d+)').Groups[1].Value)
          $nonCacheable = [int]([regex]::Match($stats, 'Non-cacheable compilations\s+(\d+)').Groups[1].Value)
          if ($requests -le 0) { throw 'sccache saw no compile requests; the launcher is not wired up.' }
          if ($nonCacheable -gt 0) {
            throw "sccache reported $nonCacheable non-cacheable compilations; debug information must stay Embedded."
          }
      - name: Stage audited native runtime packages from the compiled CMake outputs
        id: native-artifact
        shell: pwsh
        run: |
          python eng/packaging/native.py stage --vcpkg-root $env:VCPKG_ROOT
          if ($LASTEXITCODE) { throw 'Native dependency/ABI/source closure failed.' }
          "name=native-stage-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.native-artifact.outputs.name }}
          path: artifacts/native-packages/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-licence-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/licence-ide.json
            artifacts/cmake/**/licence-boundary.json
          if-no-files-found: error
          retention-days: 30
