name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VCPKG_COMMIT: 36677bbd0b3bf11da7376e62e14bffcc54d2eaeb
  VCPKG_WINDOWS_X64_GRAPH_REVISION: runtime-gpu-and-static-shims-v1

jobs:
  desktop-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Publish and smoke the desktop family
        shell: pwsh
        run: |
          foreach ($product in 'ArcChat', 'ArcNotes', 'ArcScope', 'ArcSlate') {
            $project = "src/$product/$product.Desktop/$product.Desktop.csproj"
            $output = "artifacts/release/desktop-win-x64/$product"
            dotnet restore $project --locked-mode
            if ($LASTEXITCODE) { throw "[$product,restore] failed." }
            dotnet publish $project -c Release -r win-x64 --self-contained true --no-restore -o $output
            if ($LASTEXITCODE) { throw "[$product,publish] failed." }
            $result = & "$output/$product.Desktop.exe" --smoke
            if ($LASTEXITCODE -or $result -notmatch 'ok arcforges-smoke avalonia-window') {
              throw "[$product,smoke] failed: $result"
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcforges-desktop-win-x64
          path: artifacts/release/desktop-win-x64

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: dotnet restore src/Web/ArcForges.Web.App/ArcForges.Web.App.csproj --locked-mode
      - run: dotnet publish src/Web/ArcForges.Web.App/ArcForges.Web.App.csproj -c Release --no-restore -o artifacts/release/web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcforges-web
          path: artifacts/release/web

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android --skip-manifest-update
      - run: dotnet restore src/Mobile/ArcChat.Mobile/ArcChat.Mobile.csproj --locked-mode
      - run: dotnet publish src/Mobile/ArcChat.Mobile/ArcChat.Mobile.csproj -f net10.0-android -c Release -r android-arm64 --no-restore -p:AndroidPackageFormats=apk
      - name: Stage the signed APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release/android | Out-Null
          $apk = Get-ChildItem artifacts/bin/dotnet/windows/ArcChat.Mobile/Release/net10.0-android/android-arm64 -File -Filter '*-Signed.apk' | Select-Object -First 1
          if (-not $apk) { throw 'The signed Android APK was not produced.' }
          Copy-Item -LiteralPath $apk.FullName artifacts/release/android/ArcChat.Mobile-arm64-Signed.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcchat-android-arm64
          path: artifacts/release/android/ArcChat.Mobile-arm64-Signed.apk

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore src/Cloud/ArcForges.Cloud.Host/ArcForges.Cloud.Host.csproj --locked-mode
      - run: dotnet publish src/Cloud/ArcForges.Cloud.Host/ArcForges.Cloud.Host.csproj -c Release --self-contained false --no-restore -o artifacts/release/cloud
      - run: tar -C artifacts/release/cloud -czf artifacts/arcforges-cloud-linux-x64.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcforges-cloud-linux-x64
          path: artifacts/arcforges-cloud-linux-x64.tar.gz

  native-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Pin vcpkg checkout
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Runner vcpkg installation was not found.' }
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg fetch failed.' }
          git -C $root checkout --detach --force $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed.' }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed.' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:VCPKG_COMMIT) { throw "Unexpected vcpkg commit: $actual" }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Resolve vcpkg toolchain fingerprint
        id: vcpkg-toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere was not found.' }
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $installationVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          if (-not $installationPath -or -not $installationVersion) { throw 'Visual Studio C++ tools were not found.' }
          $vcToolsVersion = (Get-Content -LiteralPath (Join-Path $installationPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $compiler = Join-Path $installationPath "VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64\cl.exe"
          $compilerVersion = (Get-Item -LiteralPath $compiler).VersionInfo.FileVersion
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkVersion = (Get-ChildItem -LiteralPath $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -replace '^cmake version\s+', '').Trim()
          $ninjaVersion = (ninja --version).Trim()
          $identity = [ordered]@{
            visualStudio = $installationVersion
            vcTools = $vcToolsVersion
            compiler = $compilerVersion
            windowsSdk = $sdkVersion
            cmake = $cmakeVersion
            ninja = $ninjaVersion
          } | ConvertTo-Json -Compress
          $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT
          "vcpkg toolchain: $identity"
          "vcpkg toolchain fingerprint: $fingerprint"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-${{ hashFiles('eng/native/vcpkg/ports/**') }}
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_WINDOWS_X64_GRAPH_REVISION }}-
      - name: Install Windows native dependencies
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          $archives = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force $archives | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$archives,readwrite"
          & "$root/vcpkg.exe" install `
            'ffmpeg[core,avcodec,avfilter,avformat,swresample,swscale,vulkan,qsv,nvcodec,amf]:x64-windows' `
            'libusb[core]:x64-windows' `
            'miniaudio[core]:x64-windows' `
            'opentimelineio[core]:x64-windows-static-md' `
            'opencolorio[core]:x64-windows-static-md' `
            'openimageio[core]:x64-windows-static-md' `
            'openexr[core]:x64-windows-static-md' `
            'imath[core]:x64-windows-static-md' `
            'mdflib[core]:x64-windows-static-md' `
            "--overlay-ports=${{ github.workspace }}/eng/native/vcpkg/ports"
          if ($LASTEXITCODE) { throw 'vcpkg install failed.' }
      - name: Build and stage both native profiles
        shell: pwsh
        run: |
          foreach ($profile in 'runtime-shared', 'shim-static') {
            $preset = "windows-msvc-x64-$profile"
            cmake --preset $preset
            if ($LASTEXITCODE) { throw "$preset configure failed." }
            cmake --build --preset "$preset-release"
            if ($LASTEXITCODE) { throw "$preset build failed." }
            cmake --install "artifacts/cmake/windows-msvc-x64/$profile" --config Release
            if ($LASTEXITCODE) { throw "$preset install failed." }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcforges-native-win-x64
          path: artifacts/stage/native/win-x64

  release-sbom:
    needs: [desktop-win-x64, web, android, cloud, native-win-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/release-bundle
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/release-bundle
          format: spdx-json
          output-file: artifacts/arcforges-release.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arcforges-release-sbom
          path: artifacts/arcforges-release.spdx.json
