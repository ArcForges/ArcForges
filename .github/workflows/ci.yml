name: CI

# Every PR is verified after the push on the Windows and Linux hosts (eng/verify.py run-and-report, ArcForges-Design
# AD-0020), which run the win-x64 and linux-x64 legs below and report the statuses main requires. For owner (deku2026)
# PRs those statuses are the whole verification, so both jobs are skipped; external PRs (Dependabot included), the
# merge queue and manual dispatch also run everything here. Push to main runs nothing: this repository has no delivery job, and
# every main commit arrived through a PR verified one way or the other.
# merge_group runs the jobs for every author, but only matters if a merge queue is configured (none is today).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

# Platform-independent merge gate (16-testing-strategy section 3): build, analyzers, format,
# tests (with the closed-loop node and CLI tests on the JIT build and again on the Native AOT binaries),
# the node store's expand-only schema check (13-distribution-updates section 9), Native AOT
# publish with zero warnings, size gates, the startup regression gate (this run's CLI against the base commit's
# CLI, both built and measured on the same runner) and the store growth bound (15-performance-targets) on
# win-x64, win-arm64, linux-x64 and linux-arm64.
# No GUI, device, browser, live-service or inference jobs; desktop UI tests are headless.
jobs:
  native:
    name: Native (${{ matrix.rid }})
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            full: true
            components: host,supervisor,desktop,testload,bench
          - os: windows-11-arm
            rid: win-arm64
            full: false
            components: host,supervisor,desktop,bench
          - os: ubuntu-24.04
            rid: linux-x64
            full: true
            components: host,desktop,testload,bench
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            full: false
            components: host,desktop,bench
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # the parent of the head is the startup gate's base on manual dispatch
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Restore locked dependencies
        run: dotnet restore ArcForges.slnx --locked-mode
      - name: Check formatting and analyzers once
        if: matrix.rid == 'linux-x64'
        run: dotnet format ArcForges.slnx --verify-no-changes --no-restore
      - name: Build with analyzers as errors
        if: matrix.full
        run: dotnet build ArcForges.slnx -c Release --no-restore
      - name: Run the ci test suite
        if: matrix.full
        run: ./eng/test.ps1 -Suite ci -NoBuild
      - name: Run the exclusive tests alone after the parallel ones
        if: matrix.full
        run: ./eng/test.ps1 -Suite exclusive -NoBuild
      - name: Check the node store schema is expand-only
        if: matrix.rid == 'linux-x64'
        run: ./eng/test.ps1 -Suite store-schema -NoBuild
      - name: Publish Native AOT with zero warnings
        env:
          TARGET_RID: ${{ matrix.rid }}
          COMPONENTS: ${{ matrix.components }}
        run: ./eng/publish.ps1 -RuntimeIdentifier $env:TARGET_RID -Component ($env:COMPONENTS -split ',') -NoRestore
      - name: Run the tools suite against the native TestLoad and Bench
        if: matrix.full
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:TARGET_RID"
          $env:ARCFORGES_TESTLOAD_PATH = Join-Path $publish "testload/arcforges-testload$suffix"
          $env:ARCFORGES_BENCH_PATH = Join-Path $publish "bench/arcforges-bench$suffix"
          ./eng/test.ps1 -Suite tools -NoBuild
      - name: Run the closed-loop suite against the native node and CLI
        if: matrix.full
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:ARCFORGES_HOST_PATH = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:TARGET_RID/host/arcforges$suffix"
          ./eng/test.ps1 -Suite closed-loop,exclusive -NoBuild
      - name: Gate sizes and store growth, and record the startup benchmark
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: ./eng/bench.ps1 -RuntimeIdentifier $env:TARGET_RID
      - name: Name the base commit for the startup gate
        id: base
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base="${PR_BASE:-$QUEUE_BASE}"
          base="${base:-$(git rev-parse HEAD^)}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: artifacts/base-commit
          persist-credentials: false
      - name: Publish the base commit's CLI
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: ./artifacts/base-commit/eng/publish.ps1 -RuntimeIdentifier $env:TARGET_RID -Component host
      - name: Gate startup against the base commit
        # Same runner: the base commit's CLI and this run's CLI are measured here, interleaved.
        env:
          TARGET_RID: ${{ matrix.rid }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baseline = "artifacts/base-commit/artifacts/publish/$env:TARGET_RID/host/arcforges$suffix"
          ./eng/compare-startup.ps1 -RuntimeIdentifier $env:TARGET_RID -BaselineExecutable $baseline -BaselineSource "base commit $env:BASE_SHA, built and measured on this runner"
      - name: Package the complete desktop directory
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: ./eng/package.ps1 -RuntimeIdentifier $env:TARGET_RID
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arcforges-desktop-${{ matrix.rid }}-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }} # also keep the results of a failed size or startup gate
        with:
          name: bench-${{ matrix.rid }}-${{ github.sha }}
          path: artifacts/bench/${{ matrix.rid }}/*.json
          if-no-files-found: warn
          retention-days: 90

  verify:
    name: Verify
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026') }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all native builds and offline checks
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
