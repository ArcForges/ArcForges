name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 3 * * 2'

permissions:
  contents: read
  security-events: write

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: windows-latest
    env:
      # Keep restored third-party source outside the checkout so CodeQL reports only ArcForges-owned files.
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - name: Build C#
        if: matrix.language == 'csharp'
        run: |
          dotnet workload install maui-android wasm-tools --skip-manifest-update
          dotnet restore ArcForges.slnx --locked-mode
          dotnet build ArcForges.slnx -c Release --no-restore
      - uses: lukka/get-cmake@1585ab63d6b868cbe53e9d1c2fa929b04b1ec2da # v4.4.2
        if: matrix.language == 'cpp'
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.language == 'cpp'
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-Windows-codeql-${{ env.VCPKG_COMMIT }}
      - name: Bootstrap pinned vcpkg
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP vcpkg
          git clone --filter=blob:none https://github.com/microsoft/vcpkg $root
          git -C $root checkout --detach $env:VCPKG_COMMIT
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          $archives = Join-Path $env:RUNNER_TEMP vcpkg-archives
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> $env:GITHUB_ENV
      - name: Build C++
        if: matrix.language == 'cpp'
        run: |
          cmake --preset windows-msvc-x64-runtime-shared
          cmake --build --preset windows-msvc-x64-runtime-shared-release
          cmake --preset windows-msvc-x64-shim-static
          cmake --build --preset windows-msvc-x64-shim-static-release
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
