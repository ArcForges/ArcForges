version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet-foundation:
        patterns: ['Microsoft.*', 'System.*']
      avalonia:
        patterns: ['Avalonia*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
