version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns: ['Avalonia*', 'SkiaSharp*', 'HarfBuzzSharp*']
      tests:
        patterns: ['xunit*', 'Microsoft.Testing.*']
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
