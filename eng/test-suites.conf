# Test suites of 16-testing-strategy section 4, read by eng/test.ps1 and eng/test.sh.
#
# suite <name> <projects> [filter ...]
#   <projects>: '*' for every tests/*/*.Tests.csproj, or comma-separated project names.
#   [filter ...]: xUnit v3 trait filters passed to each test application ('*' is a wildcard).
#   Traits: env=windows-real|linux-real|wsl-bridge (real OS; tests skip with a reason on another OS),
#   tool=dotnet|cargo|cmake|npm (skip with a reason when the tool is missing),
#   loop=local|multi-node|cloud (closed loop), category=perf (benchmarks, never by default).
# kind <task-kind> <suite> [suite ...]
#   The suites an author runs for a kind of change; the suites of one kind do not overlap.

suite unit         *  --filter-not-trait env=* --filter-not-trait loop=* --filter-not-trait category=perf
suite ci           *  --filter-not-trait env=wsl-bridge --filter-not-trait category=perf
suite windows-real *  --filter-trait env=windows-real
suite linux-real   *  --filter-trait env=linux-real
suite wsl          *  --filter-trait env=wsl-bridge
suite closed-loop  *  --filter-trait loop=*
suite desktop      ArcForges.Desktop.Tests
suite tools        ArcForges.Tools.Tests
suite repository   ArcForges.Repository.Tests
suite all          *

kind infrastructure ci
kind tools          tools repository
kind desktop        desktop
kind node           unit closed-loop
kind windows        unit windows-real
kind linux          unit linux-real
kind wsl            unit wsl
kind release        all
