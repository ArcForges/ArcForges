# Test suites of 16-testing-strategy section 4, read by eng/test.ps1 and eng/test.sh.
#
# suite <name> <projects> [filter ...]
#   <projects>: '*' for every tests/*/*.Tests.csproj, or comma-separated project names.
#   [filter ...]: xUnit v3 trait filters passed to each test application ('*' is a wildcard).
#   Traits: env=windows-real|linux-real (real OS; tests skip with a reason on another OS),
#   tool=dotnet|cargo|cmake|npm|pwsh|python (skip with a reason when the tool is missing),
#   loop=local|multi-node|cloud (closed loop), category=perf (benchmarks, never by default),
#   check=schema (the node store's expand-only schema check; its own CI step, so ci leaves it out),
#   isolation=exclusive (timing-, CPU-share- or memory-sensitive, or changing machine-wide state: the test also sets
#   DisableParallelization, so xUnit keeps it away from the parallel tests of its project; the parallel suites leave it out and the
#   exclusive suite runs it after every other suite, one project at a time and one test at a time (the scripts pass xUnit's
#   --parallel none, because DisableParallelization does not keep it away from the DisableParallelization tests of other test
#   classes, observed with xunit.v3 4.0.1); ci + exclusive cover exactly what ci covered before, and
#   the exclusive suite names exactly the projects that have exclusive tests, both checked by ArcForges.Repository.Tests).
#   Closed-loop and real-OS tests run the arcforges binaries next to the tests (JIT), or ARCFORGES_HOST_PATH (Native AOT; the
#   publish directory also holds arcforges-supervisor.exe on Windows). category=perf holds the workstation benchmarks.
# The OS secret-store tier (env=os-secret-store) is a project outside '*' that no suite names: only eng/os_secret_store_tier.py and
# its hosted workflow run it (16-testing-strategy section 1; ArcForges.Repository.Tests checks this).
# kind <task-kind> <suite> [suite ...]
#   The suites an author runs for a kind of change; the suites of one kind do not overlap.

suite unit         *  --filter-not-trait env=* --filter-not-trait loop=* --filter-not-trait category=perf --filter-not-trait isolation=exclusive
suite ci           *  --filter-not-trait category=perf --filter-not-trait check=schema --filter-not-trait isolation=exclusive
suite exclusive    ArcForges.ClosedLoop.Tests,ArcForges.Node.Core.Tests,ArcForges.Node.Platform.Linux.Tests,ArcForges.Node.Platform.Windows.Tests --filter-trait isolation=exclusive --filter-not-trait category=perf --filter-not-trait check=schema
suite windows-real *  --filter-trait env=windows-real --filter-not-trait isolation=exclusive
suite linux-real   *  --filter-trait env=linux-real --filter-not-trait isolation=exclusive
suite closed-loop  *  --filter-trait loop=* --filter-not-trait isolation=exclusive
suite desktop      ArcForges.Desktop.Tests
suite tools        ArcForges.Tools.Tests
suite repository   ArcForges.Repository.Tests
suite store        ArcForges.Node.Store.Tests
suite node-core    ArcForges.Node.Core.Tests
suite client       ArcForges.Client.Tests
suite store-schema ArcForges.Node.Store.Tests --filter-trait check=schema
suite all          *

kind infrastructure ci exclusive
kind tools          tools repository
kind desktop        desktop
kind store          store
kind node           unit closed-loop exclusive
kind cli            client closed-loop exclusive
kind windows        unit windows-real exclusive
kind linux          unit linux-real exclusive
kind release        all
